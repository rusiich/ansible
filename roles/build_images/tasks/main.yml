---
- name: Download taski repository from GitHub
  ansible.builtin.git:
    repo: "https://github.com/rusiich/taski.git"
    dest: /opt/taski
    version: main
    force: true

- name: Download ansible repository from GitHub
  ansible.builtin.git:
    repo: "https://github.com/rusiich/ansible.git"
    dest: /opt/ansible
    version: main
    force: true

- name: Copy backend Dockerfile
  ansible.builtin.copy:
    src: /opt/ansible/inventory/files/backend/Dockerfile
    dest: /opt/taski/backend/Dockerfile
    mode: '0644'

- name: Copy backend entrypoint
  ansible.builtin.copy:
    src: /opt/ansible/inventory/files/backend/entrypoint.sh
    dest: /opt/taski/backend/entrypoint.sh
    mode: '0755'

- name: Copy frontend Dockerfile
  ansible.builtin.copy:
    src: /opt/ansible/inventory/files/frontend/Dockerfile
    dest: /opt/taski/frontend/Dockerfile
    mode: '0644'

- name: Copy gateway Dockerfile
  ansible.builtin.copy:
    src: /opt/ansible/inventory/files/gateway/Dockerfile
    dest: /opt/taski/gateway/Dockerfile
    mode: '0644'

- name: Copy gateway nginx config
  ansible.builtin.copy:
    src: /opt/ansible/inventory/files/gateway/nginx.conf
    dest: /opt/taski/gateway/nginx.conf
    mode: '0644'

- name: Copy docker compose file
  ansible.builtin.copy:
    src: /opt/ansible/inventory/files/docker-compose.yml
    dest: /opt/taski/docker-compose.yml
    mode: '0644'

